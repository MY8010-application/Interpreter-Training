<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>管理者ダッシュボード</title>

<link rel="icon" href="../icon.png">

<meta name="theme-color"
content="#4285f4">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Helvetica Neue",
        Arial,
        sans-serif;

    background:#f5f7fb;
    color:#202124;
    min-height:100vh;
}

/* ============================
   ヘッダー
============================ */

.header{
    background:#4285f4;
    color:white;
    padding:22px 20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
}

.header-inner{
    max-width:900px;
    margin:0 auto;
}

.header h1{
    font-size:24px;
    font-weight:700;
}

.header p{
    margin-top:5px;
    font-size:13px;
    opacity:0.9;
}

/* ============================
   メイン
============================ */

.container{
    max-width:900px;
    margin:0 auto;
    padding:30px 20px 50px;
}

/* ============================
   アクセス概要
============================ */

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:
        0 3px 12px rgba(0,0,0,0.07);
}

.stat-label{
    font-size:14px;
    color:#666;
    margin-bottom:10px;
}

.stat-number{
    font-size:36px;
    font-weight:700;
    color:#4285f4;
}

.stat-unit{
    font-size:14px;
    color:#777;
    margin-left:4px;
}

/* ============================
   セクション
============================ */

.section{
    background:white;
    border-radius:16px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:
        0 3px 12px rgba(0,0,0,0.07);
}

.section-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:18px;
}

/* ============================
   7日間アクセス
============================ */

.access-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.access-row{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:13px 15px;

    background:#f8f9fc;
    border-radius:10px;
}

.access-date{
    font-size:14px;
    color:#444;
}

.access-count{
    font-size:16px;
    font-weight:700;
    color:#4285f4;
}

.total-row{
    margin-top:15px;
    padding-top:15px;

    border-top:1px solid #eee;

    display:flex;
    justify-content:space-between;

    font-weight:700;
}

/* ============================
   更新ボタン
============================ */

.update-area{
    text-align:center;
    margin-top:10px;
}

.update-btn{
    border:none;
    background:#4285f4;
    color:white;

    padding:13px 28px;

    border-radius:10px;

    font-size:15px;
    font-weight:600;

    cursor:pointer;

    transition:
        background 0.2s,
        transform 0.1s;
}

.update-btn:hover{
    background:#3367d6;
}

.update-btn:active{
    transform:scale(0.97);
}

/* ============================
   更新時刻
============================ */

.updated{
    text-align:center;
    color:#888;
    font-size:12px;
    margin-top:12px;
}

/* ============================
   スマホ
============================ */

@media(max-width:600px){

    .header{
        padding:20px 16px;
    }

    .header h1{
        font-size:21px;
    }

    .container{
        padding:20px 15px 40px;
    }

    .summary{
        grid-template-columns:1fr;
        gap:12px;
    }

    .stat-card{
        padding:20px;
    }

    .stat-number{
        font-size:32px;
    }

    .section{
        padding:20px;
    }

}

</style>

</head>

<body>

<!-- ============================
     ヘッダー
============================ -->

<header class="header">

    <div class="header-inner">

        <h1>
            管理者ダッシュボード
        </h1>

        <p>
            INTERPRETER TRAINING
        </p>

    </div>

</header>


<!-- ============================
     メイン
============================ -->

<main class="container">


    <!-- ============================
         アクセス概要
    ============================ -->

    <div class="summary">

        <div class="stat-card">

            <div class="stat-label">
                累計アクセス
            </div>

            <div>
                <span
                    id="totalAccess"
                    class="stat-number">
                    —
                </span>

                <span class="stat-unit">
                    回
                </span>
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                過去7日間
            </div>

            <div>

                <span
                    id="weeklyAccess"
                    class="stat-number">
                    —
                </span>

                <span class="stat-unit">
                    回
                </span>

            </div>

        </div>

    </div>


    <!-- ============================
         過去7日間
    ============================ -->

    <section class="section">

        <h2 class="section-title">
            過去7日間のアクセス
        </h2>


        <div
            id="accessList"
            class="access-list">

            <div class="access-row">

                <span class="access-date">
                    読み込み中...
                </span>

                <span class="access-count">
                    —
                </span>

            </div>

        </div>


        <div class="total-row">

            <span>
                7日間合計
            </span>

            <span
                id="weeklyTotal">
                —
            </span>

        </div>

    </section>


    <!-- ============================
         更新
    ============================ -->

    <div class="update-area">

        <button
            id="updateBtn"
            class="update-btn">

            データを更新

        </button>

        <div
            id="updated"
            class="updated">

            最終更新：—

        </div>

    </div>


</main>


<script>

// ============================
// GAS API
// ============================

const GAS_URL =
    "https://script.google.com/macros/s/AKfycbxHHbkhTkYuUj6nmbIQMu0o-e4u4669nMrAU3p9fATmTk4K_KD2dzL3LtFhbl9Twxj1/exec";


// ============================
// データ取得
// ============================

async function loadAccessData(){

    try{

const response =
    await fetch(GAS_URL + "?action=stats");
        if(!response.ok){

            throw new Error(
                "データ取得に失敗しました"
            );
        }

        const data =
            await response.json();


        // ============================
        // 累計
        // ============================

        document.getElementById(
            "totalAccess"
        ).textContent =
            data.total || 0;


        // ============================
        // 過去7日間
        // ============================

        document.getElementById(
            "weeklyAccess"
        ).textContent =
            data.weeklyTotal || 0;


        document.getElementById(
            "weeklyTotal"
        ).textContent =
            (data.weeklyTotal || 0) + "回";


        // ============================
        // 日別データ
        // ============================

        const accessList =
            document.getElementById(
                "accessList"
            );

        accessList.innerHTML = "";


        if(
            data.daily &&
            data.daily.length > 0
        ){

            data.daily.forEach(day => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "access-row";


                row.innerHTML = `

                    <span class="access-date">
                        ${day.date}
                    </span>

                    <span class="access-count">
                        ${day.count}回
                    </span>

                `;
                accessList.appendChild(row);
            });

        }else{

            accessList.innerHTML = `
                <div class="access-row">
                    <span class="access-date">
                        データがありません
                    </span>

                    <span class="access-count">
                        0回
                    </span>
                </div>

            `;

        }


        // ============================
        // 更新時刻
        // ============================

        const now =
            new Date();

        document.getElementById(
            "updated"
        ).textContent =
            "最終更新：" +
            now.toLocaleString(
                "ja-JP"
            );


    }catch(error){

        console.error(error);

        document.getElementById(
            "accessList"
        ).innerHTML = `

            <div class="access-row">

                <span class="access-date">
                    データ取得エラー
                </span>

                <span class="access-count">
                    —
                </span>

            </div>

        `;

    }

}


// ============================
// 更新ボタン
// ============================

document.getElementById(
    "updateBtn"
).addEventListener(
    "click",
    function(){

        loadAccessData();

    }
);


// ============================
// 起動
// ============================

// GAS接続が完成したら有効化
// loadAccessData();

</script>

</body>

</html>
