<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quick Response</title>
    

<style>

body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:#cccccc;
    text-align:center;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:#e9e9e9;
    border-radius:24px;
    padding:40px;
    position:relative;
}
    
.top-btn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 16px;
    border:none;
    border-radius:12px;
    background:#888;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.top-btn:hover{
    transform:translateY(-2px);
    background:#666;
}

@media(max-width:768px){

    .top-btn{
        top:15px;
        right:15px;
        padding:8px 12px;
        font-size:12px;
    }

}
.logo{
    color:#4255ff;
    font-weight:bold;
    font-size:14px;
    letter-spacing:1px;
    margin-bottom:10px;
}

h1{
    color:#2d2f36;
    font-size:42px;
    margin-bottom:40px;
}

.app-title{
    display:inline-block;
    background:white;
    color:black;
    font-size:38px;
    font-weight:800;
    padding:18px 40px;
    border-radius:20px;

    box-shadow:
        0 6px 0 #d9defa,
        0 12px 24px rgba(0,0,0,0.08);

    margin-bottom:30px;
}

/*言語ボタンサイズ*/
.language-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-top:30px;
}

.language-btn{
    display:none;/* 読み込み前は言語ボタンを隠す */
    color:white;
    border:none;
    border-radius:18px;
    padding:20px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    transition:all 0.2s ease;
}
   
/* 確認後に表示 */
.language-btn.show{
    display:block;
}
    
/*言語ボタンの色*/
.en{
    background:#4255ff;
}

.zh{
    background:#F44336;
}

.pt{
    background:#009688;
}

.mn{
    background:#FF9800;
}

.ko{
    background:#7C3AED;
}

.fr{
    background:#2563EB;
}

.vi{
    background:#10B981;
}

.de{
    background:#374151;
}

.km{
    background:#D97706;
}

.es{
    background:#26a2dc;
}
    
.language-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(66,85,255,0.3);
}

.language-btn:active{
    transform:translateY(1px);
}

.description{
    color:#666;
    font-size:18px;
    margin-top:15px;
    line-height:1.6;
}
    
.title-main{
    font-size:22px;
    font-weight:800;
    color:#000;
    line-height:1.2;
}

.title-sub{
    font-size:16px;
    font-weight:700;
    color:#000;
    letter-spacing:1px;
    margin-top:4px;
}

.card{
    background:white;
    border-radius:24px;
    padding:30px;
    margin:35px 0;

    box-shadow:
        0 15px 30px rgba(0,0,0,0.22);

    border:1px solid #eeeeee;
}
    
 /*準備中ボタン押せない*/
    .disabled{
    background:#cfcfcf;
    color:#666;
    cursor:not-allowed;
    pointer-events:none;
    }
    
/*スマホ用言語ボタンサイズ*/
@media (max-width:768px){

    .language-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .language-btn{
        font-size:18px;
        padding:12px;
    }
}
 
</style>

</head>

<script>

async function checkLanguages(){

    const categories = [
        "Vocabulary",
        "Expression",
        "All"
    ];

    const languages = [
        "en",
        "zh",
        "ko",
        "pt",
        "fr",
        "mn",
        "vi",
        "de",
        "km",
        "es"
    ];

    const response = await fetch(
        "https://script.google.com/macros/s/AKfycbz4RC1MjqKRTuW2PHHdCOd4e5l_1QZUVagJyOi2b1tgjVCBHgIB1BwI794njktyrxlx/exec?mode=languages"
    );

    const data = await response.json();

    categories.forEach(category => {

        languages.forEach(lang => {

            const button =
                document.getElementById(category + "-" + lang);

            if(!button) return;

            const available =
                data[category] && data[category][lang];

            button.classList.add("show");

            if(!available){

                button.classList.add("disabled");

                button.innerHTML =
                    button.innerHTML + "<br>準備中";

                button.onclick = null;

            }

        });

    });

}


function selectLanguage(category, lang){

    localStorage.setItem("category", category);
    localStorage.setItem("language", lang);

    window.location.href = "howto.html";

}


checkLanguages();

</script>
