
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice</title>
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#cccccc;
    color:#333;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:#e9e9e9;
    border-radius:24px;
    padding:40px;
    position:relative;
}

.top-btn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 16px;
    border:none;
    border-radius:12px;
    background:#888;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.top-btn:hover{
    transform:translateY(-2px);
    background:#666;
}

.app-title{
    display:inline-block;
    background:white;
    padding:18px 40px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:0 6px 0 #d9defa,0 12px 24px rgba(0,0,0,.08);
}

.title-main{
    font-size:34px;
    font-weight:800;
}

.title-sub{
    margin-top:5px;
    font-size:18px;
    font-weight:600;
}

.logo{
    color:#4255ff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:22px;
    padding:30px;
    text-align:left;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.card h2{
    text-align:center;
    margin-bottom:25px;
}

.step{
    display:flex;
    align-items:flex-start;
    gap:15px;
    margin-bottom:25px;
}

.icon{
    font-size:34px;
    width:50px;
    text-align:center;
    flex-shrink:0;
}

.text h3{
    margin:0 0 5px;
    font-size:20px;
}

.text p{
    margin:0;
    color:#666;
    line-height:1.6;
}

.section-title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin:35px 0 15px;
}

.audio-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.audio-btn{
    width:100%;
    padding:20px;
    border:2px solid #333;
    border-radius:18px;
    background:#222;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.audio-btn:hover{
    transform:translateY(-3px);
    border-color:#4255ff;
    background:#333;
}

.back-btn{
    margin-top:25px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:18px;
    background:#888;
    color:white;
    font-size:18px;
    cursor:pointer;
}

@media(max-width:768px){
    .container{
        margin:20px;
        padding:25px;
    }

    .top-btn{
        top:15px;
        right:15px;
        padding:8px 12px;
        font-size:12px;
    }

    .title-main{
        font-size:28px;
    }

    .step{
        flex-direction:row;
    }

    .audio-btn{
        padding:17px;
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="container">

<button class="top-btn" onclick="location.href='../index.html'">
← トップへ
</button>

<div class="app-title">
    <div class="title-main">Practice</div>
    <div class="title-sub">実践通訳練習</div>
    <p>Coming soon...</p>
</div>

<div class="logo">INTERPRETER TRAINING</div>

<div class="card">

<h2>練習の流れ</h2>

<div class="step">
    <div class="icon">🎧</div>
    <div class="text">
        <h3>① 音声を聞く</h3>
        <p>日本語の音声を聞き、内容を理解します。</p>
    </div>
</div>

<div class="step">
    <div class="icon">🧠</div>
    <div class="text">
        <h3>② チャプターごとに通訳する</h3>
        <p>音声はチャプターの終わりで自動停止します。聞いた内容を外国語に通訳してください。</p>
    </div>
</div>

<div class="step">
    <div class="icon">📖</div>
    <div class="text">
        <h3>③ 原文を確認する</h3>
        <p>チャプターごとに、音声に対応した日本語の文章を確認できます。</p>
    </div>
</div>

<div class="section-title">音声を選択</div>

<div class="audio-list" id="audioList">
    <p>音声一覧を読み込んでいます...</p>
</div>

<button class="back-btn" onclick="location.href='../index.html'">
    ← 戻る
</button>

</div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzOwRsJPvgaC4jyign9XRXNlAqvxEKdDSFpJFkjP9DHnADH5yktqsIK7ILfAvv-8ELP/exec";

async function loadAudioList(){
    const audioList = document.getElementById("audioList");

    try{
        const response = await fetch(GAS_URL);
        const audioIds = await response.json();

        audioList.innerHTML = "";

        audioIds.forEach(audioId => {
            const button = document.createElement("button");

            button.className = "audio-btn";
            button.textContent = audioId
                .replace(".wav","")
                .replace("practice","Practice ");

            button.onclick = () => selectAudio(audioId);

            audioList.appendChild(button);
        });

        if(audioIds.length === 0){
            audioList.innerHTML = "<p>音声が登録されていません。</p>";
        }

    }catch(error){
        audioList.innerHTML = "<p>音声一覧を読み込めませんでした。</p>";
    }
}

function selectAudio(audioId){
    localStorage.setItem("practiceAudio",audioId);
    location.href = "quiz.html";
}

loadAudioList();
</script>

</body>
</html>
