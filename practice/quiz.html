
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice</title>
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#cccccc;
    color:#333;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:#e9e9e9;
    border-radius:24px;
    padding:40px;
    position:relative;
}

.top-btn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 16px;
    border:none;
    border-radius:12px;
    background:#888;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.app-title{
    display:inline-block;
    background:white;
    padding:18px 40px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:0 6px 0 #d9defa,0 12px 24px rgba(0,0,0,.08);
}

.title-main{
    font-size:34px;
    font-weight:800;
}

.title-sub{
    margin-top:5px;
    font-size:18px;
    font-weight:600;
}

.logo{
    color:#4255ff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:22px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.audio-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:25px;
}

.chapter-info{
    margin-bottom:20px;
    color:#666;
    font-size:16px;
}

.progress-area{
    margin:25px 0;
}

#seekBar{
    width:100%;
    cursor:pointer;
}

.time-display{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#777;
    margin-top:5px;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:25px;
    margin:25px 0;
}

.control-btn{
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:#eee;
    font-size:22px;
    cursor:pointer;
}

.play-btn{
    width:70px;
    height:70px;
    background:#4255ff;
    color:white;
    font-size:28px;
}

.section-title{
    font-size:20px;
    font-weight:bold;
    margin:35px 0 15px;
}

.chapter-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.chapter-btn{
    width:100%;
    padding:15px;
    border:2px solid #ddd;
    border-radius:14px;
    background:#f5f5f5;
    font-size:16px;
    text-align:left;
    cursor:pointer;
}

.chapter-btn.active{
    border-color:#4255ff;
    background:#eef0ff;
}

.transcript-btn{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#eee;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.transcript{
    display:none;
    margin-top:15px;
    padding:20px;
    background:#f5f5f5;
    border-radius:14px;
    text-align:left;
    line-height:1.8;
}

.back-btn{
    margin-top:25px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:18px;
    background:#888;
    color:white;
    font-size:18px;
    cursor:pointer;
}

@media(max-width:768px){
    .container{
        margin:20px;
        padding:25px;
    }

    .top-btn{
        top:15px;
        right:15px;
        padding:8px 12px;
        font-size:12px;
    }

    .title-main{
        font-size:28px;
    }

    .controls{
        gap:15px;
    }
}
</style>
</head>

<body>

<div class="container">

<button class="top-btn" onclick="location.href='index.html'">
← 戻る
</button>

<div class="app-title">
    <div class="title-main">Practice</div>
    <div class="title-sub">実践通訳練習</div>
</div>

<div class="logo">INTERPRETER TRAINING</div>

<div class="card">

<div class="audio-title" id="audioTitle">Practice</div>

<div class="chapter-info">
    Chapter 1 / 15
    <br>
    0秒 ～ 3秒
</div>

<div class="progress-area">
    <input type="range" id="seekBar" min="0" max="100" value="0">

    <div class="time-display">
        <span>0:00</span>
        <span>1:32</span>
    </div>
</div>

<div class="controls">

<button class="control-btn">↶</button>

<button class="control-btn play-btn">▶</button>

<button class="control-btn">↷</button>

</div>

<div class="section-title">チャプター一覧</div>

<div class="chapter-list" id="chapterList">

<button class="chapter-btn active">
    Chapter 1　0秒 ～ 3秒
</button>

<button class="chapter-btn">
    Chapter 2　3秒 ～ 7秒
</button>

<button class="chapter-btn">
    Chapter 3　7秒 ～ 12秒
</button>

</div>

<button class="transcript-btn">
日本語原稿を見る ▼
</button>

<div class="transcript">
    ここに選択したチャプターの日本語原稿が表示されます。
</div>

<button class="back-btn" onclick="location.href='index.html'">
← 音声選択に戻る
</button>

</div>
</div>

<script>
const audioId = localStorage.getItem("practiceAudio");

if(audioId){
    document.getElementById("audioTitle").textContent =
        audioId.replace(".wav","").replace("practice","Practice ");
}else{
    document.getElementById("audioTitle").textContent = "音声が選択されていません";
}
const GAS_URL = "https://script.google.com/macros/s/AKfycbzOwRsJPvgaC4jyign9XRXNlAqvxEKdDSFpJFkjP9DHnADH5yktqsIK7ILfAvv-8ELP/exec";

async function loadChapters(){
    if(!audioId) return;

    try{
        const response = await fetch(
            GAS_URL + "?audioId=" + encodeURIComponent(audioId)
        );

        const chapters = await response.json();

        const chapterList = document.getElementById("chapterList");

chapterList.innerHTML = "";

chapters.forEach((chapter, index) => {
    const button = document.createElement("button");

    button.className = "chapter-btn";
    if(index === 0){
        button.classList.add("active");
    }

    button.textContent =
        `Chapter ${chapter.chapter}　${chapter.start}秒 ～ ${chapter.end}秒`;

    chapterList.appendChild(button);
});

    }catch(error){
        alert("チャプター情報を取得できませんでした。");
    }
}

loadChapters();
</script>

</body>
</html>
