
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice</title>
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#cccccc;
    color:#333;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:#e9e9e9;
    border-radius:24px;
    padding:40px;
    position:relative;
}

.top-btn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 16px;
    border:none;
    border-radius:12px;
    background:#888;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.app-title{
    display:inline-block;
    background:white;
    padding:18px 40px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:0 6px 0 #d9defa,0 12px 24px rgba(0,0,0,.08);
}

.title-main{
    font-size:34px;
    font-weight:800;
}

.title-sub{
    margin-top:5px;
    font-size:18px;
    font-weight:600;
}

.logo{
    color:#4255ff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:22px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.audio-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:25px;
}

.chapter-info{
    margin-bottom:20px;
    color:#666;
    font-size:16px;
}

.progress-area{
    margin:25px 0;
}

.chapter-markers{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:6px;
    height:auto;
    margin-bottom:10px;
}

.chapter-marker{
    position:static;
    transform:none;
    width:100%;
    height:32px;
    padding:0;
    border:none;
    border-radius:6px;
    background:#d6d6d6;
    color:#444;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}
    
.chapter-marker.active{
    background:#4255ff;
    color:white;
}
    
#seekBar{
    width:100%;
    cursor:pointer;
}

.time-display{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#777;
    margin-top:5px;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:25px;
    margin:25px 0;
}

.control-btn{
    width:55px;
    height:55px;
    border:2px solid #bbb;
    border-radius:50%;
    background:#d8d8d8;
    color:#444;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.play-btn{
    width:70px;
    height:70px;
    background:#4255ff;
    color:white;
    font-size:28px;
}
.play-btn.paused{
    background:#e53935;
}
.section-title{
    font-size:20px;
    font-weight:bold;
    margin:35px 0 15px;
}

.chapter-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.chapter-btn{
    width:100%;
    padding:15px;
    border:2px solid #ddd;
    border-radius:14px;
    background:#f5f5f5;
    font-size:16px;
    text-align:left;
    cursor:pointer;
}

.chapter-btn.active{
    border-color:#4255ff;
    background:#eef0ff;
}

.transcript-btn{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:1px solid #555;
    border-radius:14px;
    background:#222;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.transcript{
    display:none;
    margin-top:15px;
    padding:20px;
    background:#f5f5f5;
    border-radius:14px;
    text-align:left;
    line-height:1.8;
    max-height:180px;
    overflow-y:auto;
}

.back-btn{
    margin-top:25px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:18px;
    background:#888;
    color:white;
    font-size:18px;
    cursor:pointer;
}
.keyboard-guide{
    margin:30px 0 20px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:12px;
    background:#f5f5f5;
    color:#444;
    font-size:13px;
    line-height:1.8;
}

.keyboard-guide div{
    font-weight:bold;
    font-size:14px;
    margin-bottom:8px;
}

.keyboard-guide p{
    margin:2px 0;
}

@media(max-width:768px){
    .container{
        margin:20px;
        padding:25px;
    }

    .top-btn{
        top:15px;
        right:15px;
        padding:8px 12px;
        font-size:12px;
    }

    .title-main{
        font-size:28px;
    }

    .controls{
        gap:15px;
    }
    .chapter-markers{
        display:grid;
        grid-template-columns:repeat(8,1fr);
        gap:6px;
        height:auto;
        margin-bottom:10px;
    }

    .chapter-marker{
        position:static;
        transform:none;
        width:100%;
        height:32px;
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="container">

<button class="top-btn" onclick="location.href='index.html'">
← 戻る
</button>

<div class="app-title">
    <div class="title-main">Practice</div>
    <div class="title-sub">実践通訳練習</div>
</div>

<div class="logo">INTERPRETER TRAINING</div>

<div class="card">

<div class="audio-title" id="audioTitle">Practice</div>

<audio id="audioPlayer" preload="auto">
    <source src="" type="audio/wav">
</audio>


<div class="chapter-info">
    <span id="chapterNumber">Chapter 1 / 15</span>
    <span id="chapterTime" style="display:none;"></span>
</div>

<div class="progress-area">

    <div class="chapter-markers" id="chapterMarkers"></div>

    <input type="range" id="seekBar" min="0" max="100" value="0">

    <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="durationTime">0:00</span>
    </div>

</div>

<button class="transcript-btn" id="transcriptBtn">
テキストを見る ▼
</button>

<div class="transcript" id="transcript">
    ここにテキストが表示されます。
</div>

<div class="controls">

<button class="control-btn" id="backBtn">◀</button>

<button class="control-btn play-btn" id="playBtn">▶</button>

<button class="control-btn" id="forwardBtn">▶</button>

</div>

<div class="keyboard-guide">
    <div>⌨ キーボード操作</div>
    <p>Space：再生・一時停止　↓：テキスト表示・非表示</p>　
    <p>←：前のチャプター　→：次のチャプター</p>
</div>

<button class="back-btn" onclick="location.href='index.html'">
← 音声選択に戻る
</button>

</div>
</div>

<script>
const audioId = localStorage.getItem("practiceAudio");
const audioPlayer = document.getElementById("audioPlayer");
let currentChapter = null;
let chapters = [];
    
if(audioId){
    audioPlayer.src = "audio/" + audioId;
    audioPlayer.load();
}
    
if(audioId){
    document.getElementById("audioTitle").textContent =
        audioId.replace(".wav","").replace("practice","Practice ");
}else{
    document.getElementById("audioTitle").textContent = "音声が選択されていません";
}
const GAS_URL = "https://script.google.com/macros/s/AKfycbzOwRsJPvgaC4jyign9XRXNlAqvxEKdDSFpJFkjP9DHnADH5yktqsIK7ILfAvv-8ELP/exec";

async function loadChapters(){
    if(!audioId) return;

    try{
       const response = await fetch(
    GAS_URL + "?audioId=" + encodeURIComponent(audioId)
);

if(!response.ok){
    throw new Error("GASとの通信に失敗しました");
}

chapters = await response.json();

if(!Array.isArray(chapters)){
    throw new Error("取得データの形式が正しくありません");
}

const chapterMarkers = document.getElementById("chapterMarkers");
        chapterMarkers.innerHTML = "";

const totalDuration = Number(chapters[chapters.length - 1].end);
        chapters.forEach((chapter, index) => {
    
const button = document.createElement("button");

    button.className = "chapter-marker";
    button.textContent = chapter.chapter;
    button.style.left = `${(Number(chapter.start) / totalDuration) * 100}%`;
    
    if(index === 0){
        button.classList.add("active");
        currentChapter = chapter;
    }

    button.addEventListener("click", () => {
        currentChapter = chapter;

        audioPlayer.currentTime = Number(chapter.start);

        document.getElementById("chapterNumber").textContent =
            `Chapter ${chapter.chapter} / ${chapters.length}`;

        document.getElementById("chapterTime").textContent =
            `${chapter.start}秒 ～ ${chapter.end}秒`;

        document.getElementById("transcript").textContent = chapter.text;

        document.querySelectorAll(".chapter-marker").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        playBtn.textContent = "▶";
    });

    chapterMarkers.appendChild(button);
});

if(chapters.length > 0){
    const firstChapter = chapters[0];

    document.getElementById("chapterNumber").textContent =
        `Chapter ${firstChapter.chapter} / ${chapters.length}`;

    document.getElementById("chapterTime").textContent =
        `${firstChapter.start}秒 ～ ${firstChapter.end}秒`;

    document.getElementById("transcript").textContent = firstChapter.text;
}
audioPlayer.addEventListener("timeupdate", () => {
    const chapter = [...chapters].reverse().find(ch =>
        audioPlayer.currentTime >= Number(ch.start)
    );

    if(!chapter || chapter === currentChapter) return;

    currentChapter = chapter;

    document.getElementById("chapterNumber").textContent =
        `Chapter ${chapter.chapter} / ${chapters.length}`;

    document.getElementById("chapterTime").textContent =
        `${chapter.start}秒 ～ ${chapter.end}秒`;

    document.getElementById("transcript").textContent = chapter.text;

    document.querySelectorAll(".chapter-marker").forEach(btn => {
        btn.classList.toggle(
            "active",
            btn.textContent === String(chapter.chapter)
        );
    });
});

    }catch(error){
        alert("チャプター情報を取得できませんでした。");
    }
}

loadChapters();

const playBtn = document.getElementById("playBtn");

playBtn.addEventListener("click", () => {
    if(audioPlayer.paused){
        audioPlayer.play();
        playBtn.textContent = "Ⅱ";
        playBtn.classList.add("paused");
    }else{
        audioPlayer.pause();
        playBtn.textContent = "▶";
        playBtn.classList.remove("paused");
    }
});

audioPlayer.addEventListener("ended", () => {
    playBtn.textContent = "▶";
    playBtn.classList.remove("paused");
});

    
const backBtn = document.getElementById("backBtn");
const forwardBtn = document.getElementById("forwardBtn");

function updateChapterDisplay(chapter){
    document.getElementById("chapterNumber").textContent =
        `Chapter ${chapter.chapter} / ${chapters.length}`;

    document.getElementById("chapterTime").textContent =
        `${chapter.start}秒 ～ ${chapter.end}秒`;

    document.getElementById("transcript").textContent = chapter.text;

    document.querySelectorAll(".chapter-marker").forEach(btn => {
        btn.classList.toggle(
            "active",
            btn.textContent === String(chapter.chapter)
        );
    });
}

backBtn.addEventListener("click", () => {
    if(!currentChapter) return;

    const currentIndex = chapters.findIndex(
        chapter => chapter === currentChapter
    );

    if(currentIndex > 0){
        currentChapter = chapters[currentIndex - 1];
        audioPlayer.currentTime = Number(currentChapter.start);
        updateChapterDisplay(currentChapter);
    }
});

forwardBtn.addEventListener("click", () => {
    if(!currentChapter) return;

    const currentIndex = chapters.findIndex(
        chapter => chapter === currentChapter
    );

    if(currentIndex < chapters.length - 1){
        currentChapter = chapters[currentIndex + 1];
        audioPlayer.currentTime = Number(currentChapter.start);
        updateChapterDisplay(currentChapter);
    }
});


const seekBar = document.getElementById("seekBar");

audioPlayer.addEventListener("timeupdate", () => {
    if(audioPlayer.duration){
        seekBar.value =
            (audioPlayer.currentTime / audioPlayer.duration) * 100;
    }
});

seekBar.addEventListener("input", () => {
    if(audioPlayer.duration){
        audioPlayer.currentTime =
            (seekBar.value / 100) * audioPlayer.duration;
    }
});

const currentTimeDisplay = document.getElementById("currentTime");
const durationTimeDisplay = document.getElementById("durationTime");

function formatTime(seconds){
    if(!Number.isFinite(seconds)) return "0:00";

    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = Math.floor(seconds % 60);

    return minutes + ":" + String(remainingSeconds).padStart(2,"0");
}

audioPlayer.addEventListener("loadedmetadata", () => {
    durationTimeDisplay.textContent = formatTime(audioPlayer.duration);
});

audioPlayer.addEventListener("timeupdate", () => {
    currentTimeDisplay.textContent = formatTime(audioPlayer.currentTime);
});

audioPlayer.addEventListener("timeupdate", () => {
    if(currentChapter && audioPlayer.currentTime >= Number(currentChapter.end)){
        audioPlayer.pause();
        audioPlayer.currentTime = Number(currentChapter.end);
        playBtn.textContent = "▶";
        playBtn.classList.remove("paused");
    }
});
const transcriptBtn = document.getElementById("transcriptBtn");
const transcript = document.getElementById("transcript");

transcriptBtn.addEventListener("click", () => {
       if(getComputedStyle(transcript).display === "none"){
        transcript.style.display = "block";
        transcriptBtn.textContent = "テキストを閉じる ▲";
    }else{
        transcript.style.display = "none";
        transcriptBtn.textContent = "テキストを見る ▼";
    }
});
document.addEventListener("keydown", (e) => {
    if(e.target.tagName === "INPUT" ||
       e.target.tagName === "TEXTAREA" ||
       e.target.isContentEditable){
        return;
    }

    if(e.code === "Space"){
        e.preventDefault();
        playBtn.click();
    }

    if(e.code === "ArrowLeft"){
        e.preventDefault();
        backBtn.click();
    }

    if(e.code === "ArrowRight"){
        e.preventDefault();
        forwardBtn.click();
    }

    if(e.code === "ArrowDown"){
        e.preventDefault();
        transcriptBtn.click();
    }
});

</script>

</body>
</html>
