<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interpreter Training</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f8fc;
    color:#333;
}

header{
    background:linear-gradient(135deg,#4a6cff,#6d8dff);
    color:white;
    text-align:center;
    padding:45px 20px;
}

header h1{
    font-size:34px;
    margin-bottom:10px;
}

header p{
    font-size:16px;
    opacity:0.9;
}

.container{
    max-width:700px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:25px;
    cursor:pointer;
    transition:0.2s;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

.card h2{
    font-size:28px;
    margin-bottom:8px;
}

.card p{
    color:#666;
    line-height:1.5;
}

.coming{
    opacity:.6;
}

footer{
    text-align:center;
    margin:40px 0;
    color:#999;
    font-size:14px;
}
.quick{
    border-left:8px solid #4a6cff;
}

.summary{
    border-left:8px solid #28a745;
}

.interpretation{
    border-left:8px solid #ff9800;
}
.card{
    text-decoration:none;
    color:#333;
    display:block;
}
</style>
</head>

<body>

<header>

<h1>🌏 Interpreter Training</h1>

<p>
Train your listening.<br>
Improve your interpreting.
</p>

</header>

<div class="container">

<div class="card quick"
onclick="location.href='quick/index.html'">

<h2>📘 Quick Response</h2>

<p>
Instant vocabulary interpretation training.
</p>


</div>

<div class="card summary"
onclick="location.href='summarization/index.html'">

<h2>📝 Summarization（要約練習）</h2>

<p>
Summarize what you hear.
</p>

</div>


<a href="short/index.html" class="card interpretation">

<h2>🎤 Short Interpretation（短文通訳練習）</h2>

<p>
Interpret sentence by sentence.<br>
</p>

</a>
    
</div>

<footer>

© Masato Yamaji

</footer>

</body>
</html>
