<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
    
<title>Interpreter Training</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f8fc;
    color:#333;
}

header{
    background:linear-gradient(135deg,#4a6cff,#6d8dff);
    color:white;
    text-align:center;
    padding:45px 20px;
}

header h1{
    font-size:34px;
    margin-bottom:10px;
}

header p{
    font-size:16px;
    opacity:0.9;
}

.container{
    max-width:700px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:25px;
    cursor:pointer;
    transition:0.2s;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

.card h2{
    font-size:28px;
    margin-bottom:8px;
}

.card p{
    color:#666;
    line-height:1.5;
}

.coming{
    opacity:.6;
}

footer{
    text-align:center;
    margin:40px 0;
    color:#999;
    font-size:14px;
}
.quick{
    border-left:8px solid #4a6cff;
}

.summary{
    border-left:8px solid #28a745;
}

.interpretation{
    border-left:8px solid #ff9800;
}
.card{
    text-decoration:none;
    color:#333;
    display:block;
}
.card h2 span{
font-size:16px;
font-weight:normal;
}

@media(max-width:768px){
    .card h2 span{
    font-size:12px;
    }
/* ============================
   アプリのように使う方法
============================ */

.app-guide{
    text-align:center;
    margin-top:50px;
}

.app-guide-btn{
    background:white;
    border:2px solid #4a6cff;
    color:#4a6cff;
    border-radius:14px;
    padding:14px 24px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

.app-guide-btn:hover{
    background:#4a6cff;
    color:white;
    transform:translateY(-2px);
}

.app-guide-content{
    display:none;
    margin-top:25px;
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.app-guide-content img{
    width:100%;
    max-width:700px;
    height:auto;
    display:block;
    margin:0 auto;
    border-radius:12px;
}
}
</style>
</head>

<body>

<header>

<h1>Interpreter Training</h1>


</header>

<div class="container">

<div class="card quick"
onclick="location.href='quick/index.html'">

<h2>Quick Response</h2>

</div>

<div class="card summary"
onclick="location.href='summarization/index.html'">

<h2>Summarization<span>（要約練習）</span></h2>

</div>


<a href="short/index.html" class="card interpretation">

<h2>Short Interpretation<span>（短文通訳練習）</span></h2>

</a>
    
</div>
<div class="app-guide">

<h2>アプリのように使う方法</h2>

<button onclick="toggleGuide()">
使い方を見る
</button>

<div id="guideImage" class="app-guide-content" style="display:none;">
    <img
        src="app-guide.png"
        alt="アプリのように使う方法"
    >
</div>

</div>
<footer>

© MY

</footer>
    <!-- ここまで既存のHTML -->
    
<script>

if("serviceWorker" in navigator){
    window.addEventListener("load",()=>{
        navigator.serviceWorker.register("service-worker.js");
    });
}

</script>
<script>
fetch(
    "https://script.google.com/macros/s/AKfycbxHHbkhTkYuUj6nmbIQMu0o-e4u4669nMrAU3p9fATmTk4K_KD2dzL3LtFhbl9Twxj1/exec?course=Home"
);

function toggleGuide(){

    const guide =
        document.getElementById("guideImage");

    if(guide.style.display === "none"){
        guide.style.display = "block";
    }else{
        guide.style.display = "none";
    }

}
</script>

</body>
</html>
