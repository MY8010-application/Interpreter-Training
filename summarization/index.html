<!DOCTYPE html>

<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Summarization</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#4285f4">

<style>

body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:#cccccc;
    text-align:center;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    margin-top:30px;
    background:#e9e9e9;
    padding:40px;
    border-radius:24px;
}

.app-title{
    display:inline-block;
    background:white;
    color:black;
    padding:18px 40px;
    border-radius:20px;

    box-shadow:
        0 6px 0 #d9defa,
        0 12px 24px rgba(0,0,0,.08);

    margin-bottom:25px;
}

.title-main{
    font-size:34px;
    font-weight:800;
}

.title-sub{
    font-size:18px;
    margin-top:5px;
    font-weight:600;
}

.logo{
    color:#4255ff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:20px;
}

.description{
    color:#666;
    font-size:18px;
    line-height:1.6;
    margin-bottom:30px;
}

.card{
    background:white;
    border-radius:24px;
    padding:35px;

    box-shadow:
        0 15px 30px rgba(0,0,0,.18);
}

.start-btn{

    width:100%;
    margin:15px 0;
    padding:22px;

    border:none;
    border-radius:18px;

    background:#4255ff;
    color:white;

    font-size:24px;
    font-weight:bold;

    cursor:pointer;
    transition:.2s;

}

.start-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 8px 20px rgba(66,85,255,.3);

}

.start-btn:active{

    transform:translateY(1px);

}

@media(max-width:768px){

.container{

    padding:25px;

}

.title-main{

    font-size:28px;

}

.start-btn{

    font-size:20px;

    padding:18px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="app-title">

<div class="title-main">
📝 Summarization
</div>

<div class="title-sub">
要約練習
</div>

</div>

<div class="logo">
INTERPRETER TRAINING
</div>

<div class="description">
Tenrikyo Script
</div>

<div class="card">

<button class="start-btn" onclick="startSummarization()">
▶ START
</button>

</div>

</div>

<script>

function startSummarization(){

    window.location.href = "howto.html";

}

</script>

</body>

</html>
