<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Summarization</title>

<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<meta name="theme-color" content="#4285f4">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#cccccc;
    color:#333;
    text-align:center;
    padding:20px;
}

.container{
    max-width:850px;
    margin:auto;
    background:#e9e9e9;
    border-radius:24px;
    padding:40px;
    position:relative;
}

.app-title{
    display:inline-block;
    background:white;
    padding:18px 40px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:
        0 6px 0 #d9defa,
        0 12px 24px rgba(0,0,0,.08);
}

.title-main{
    font-size:34px;
    font-weight:800;
}

.title-sub{
    margin-top:5px;
    font-size:18px;
    font-weight:600;
}

.logo{
    color:#4255ff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:25px;
}

.question-info{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.progress{
    width:100%;
    height:18px;
    background:#d9d9d9;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:35px;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#4255ff;
    transition:.3s;
}

.card{
    background:white;
    border-radius:22px;
    padding:30px;
    margin-bottom:30px;
    box-shadow:
        0 10px 25px rgba(0,0,0,.12);
}

.card h2{
    margin-bottom:20px;
}

button{
    border:none;
    border-radius:18px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-3px);
}

button:active{
    transform:translateY(1px);
}

#playBtn{
    width:100%;
    padding:18px;
    background:#4255ff;
    color:white;
    font-size:24px;
    font-weight:bold;
}

#toggleTextBtn{
    width:100%;
    padding:16px;
    background:#6b7280;
    color:white;
    font-size:20px;
}

#textArea{
    display:none;
    margin-top:20px;
    background:#f5f5f5;
    border-radius:16px;
    padding:20px;
    text-align:left;
    line-height:1.8;
}

#charCount{
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

#charGuide{
    color:#666;
    margin-bottom:15px;
}

textarea{
    width:100%;
    min-height:220px;
    resize:vertical;
    padding:18px;
    font-size:18px;
    border:2px solid #ddd;
    border-radius:18px;
    outline:none;
}

textarea:focus{
    border-color:#4255ff;
}

#hintBtn{
    width:100%;
    padding:16px;
    background:#10b981;
    color:white;
    font-size:20px;
}

#hintArea{
    display:none;
    margin-top:20px;
    background:#f8f8f8;
    border-radius:16px;
    padding:20px;
    text-align:left;
}

#hintArea ul{
    padding-left:25px;
}

#hintArea li{
    margin-bottom:10px;
}

.review-buttons{
    display:flex;
    gap:15px;
}

.review-buttons button{
    flex:1;
    padding:18px;
    font-size:20px;
    font-weight:bold;
}

.good{
    background:#4CAF50;
    color:white;
}

.normal{
    background:#FFC107;
}

.bad{
    background:#F44336;
    color:white;
}

#nextBtn{
    display:none;
    width:100%;
    padding:22px;
    background:#4255ff;
    color:white;
    font-size:26px;
    font-weight:bold;
}

.back-theme-btn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 16px;
    border:none;
    border-radius:12px;
    background:#888;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    z-index:1000;
    transition:.2s;
}

.back-theme-btn:hover{
    transform:translateY(-2px);
    background:#666;
}

@media(max-width:768px){

    .container{
        padding:22px;
    }

    .title-main{
        font-size:28px;
    }

    .review-buttons{
        flex-direction:column;
    }

    textarea{
        min-height:180px;
    }

    #playBtn,
    #toggleTextBtn,
    #hintBtn{
        font-size:20px;
    }

    .back-theme-btn{
        top:15px;
        right:15px;
        padding:8px 12px;
        font-size:12px;
    }

}

</style>
</head>

<body>

<button class="back-theme-btn" onclick="location.href='howto.html'">
    ← テーマ選択へもどる
</button>

<div class="container">

    <!-- タイトル -->
    <div class="app-title">
        <div class="title-main">
            📝 Summarization
        </div>

        <div class="title-sub">
            要約練習
        </div>
    </div>

    <div class="logo">
        INTERPRETER TRAINING
    </div>

    <!-- 問題番号 -->
    <div class="question-info">
        <span id="questionNumber">
            Question 1 / 20
        </span>
    </div>

    <!-- 進捗バー -->
    <div class="progress">
        <div id="progressFill" class="progress-fill"></div>
    </div>

    <!-- 音声 -->
    <div class="card">

        <h2>🎧 音声</h2>

        <button id="playBtn">
            ▶ 再生
        </button>

        <audio id="audio" preload="auto"></audio>

    </div>

    <!-- テキスト -->
    <div class="card">

        <button id="toggleTextBtn">
            👁 テキストを表示
        </button>

        <div id="textArea" style="display:none;">

            <p id="originalText">
                ここに本文が表示されます
            </p>

        </div>

    </div>

    <!-- 要約 -->
    <div class="card">

        <h2>✍️ あなたの要約</h2>

        <div id="charCount">
            文字数：0文字
        </div>

        <div id="charGuide">
            目安：50〜100文字
        </div>

        <textarea
            id="summaryInput"
            rows="8"
            placeholder="ここに要約を書いてください"
        ></textarea>

    </div>

    <!-- 要点 -->
    <div class="card">

        <button id="hintBtn">
            💡 要点を見る
        </button>

        <div id="hintArea" style="display:none;">

            <ul id="pointList">
            </ul>

        </div>

    </div>

    <!-- 自己評価 -->
    <div class="card">

        <h2>
            📊 自己評価
        </h2>

        <div class="review-buttons">

            <button class="good" onclick="rate('good')">
                🟢 できた
            </button>

            <button class="normal" onclick="rate('normal')">
                🟡 もう少し
            </button>

            <button class="bad" onclick="rate('bad')">
                🔴 がんばる
            </button>

        </div>

    </div>

    <!-- 次へ -->
    <button id="nextBtn" style="display:none;">
        ▶ 次の問題
    </button>

</div>
<script>

let questions = [];
let currentQuestionIndex = 0;
let currentQuestion = null;


// ============================
// GASからデータ取得
// ============================

async function loadQuestions(){

    try{

        const response = await fetch(
            "https://script.google.com/macros/s/AKfycbztXPsCnPdVcRt51CUd6Z_sN9fEaD9FS9WrJ2xDjRn-BYrovdSR_aZh3cjrf3d2dC6sFw/exec"
        );

        if(!response.ok){
            throw new Error("データ取得に失敗しました");
        }

        const data = await response.json();


        // ============================
        // 選択されたテーマを取得
        // ============================

        const savedThemes =
            JSON.parse(localStorage.getItem("selectedThemes")) || [];

        const selectedThemes =
            savedThemes.map(theme => String(theme).trim());


        // ============================
        // 選択されたテーマだけを問題にする
        // ============================

        const filteredData = data.filter(row => {

            const themeId =
                String(row.themeId).trim();

            return selectedThemes.includes(themeId);

        });


        if(filteredData.length === 0){

            document.getElementById("questionNumber").textContent =
                "問題がありません";

            document.getElementById("originalText").textContent =
                "選択したテーマの問題が見つかりません。";

            return;

        }


        // ============================
        // 1行 = 1問として扱う
        // ============================

        questions = filteredData.map(row => {

            const points = [];

            if(row.point1){
                points.push(row.point1);
            }

            if(row.point2){
                points.push(row.point2);
            }

            if(row.point3){
                points.push(row.point3);
            }

            if(row.point4){
                points.push(row.point4);
            }

            return {
                themeId: row.themeId,
                order: row.order,
                text: row.text,
                points: points,
                audio: row.audio
            };

        });


        // ============================
        // テーマ → 順番の順に並べる
        // ============================

        questions.sort((a, b) => {

            if(a.themeId !== b.themeId){

                return a.themeId.localeCompare(b.themeId);

            }

            return Number(a.order) - Number(b.order);

        });


        console.log("読み込んだ問題:", questions);


        showQuestion();


    }catch(error){

        console.error(error);

        document.getElementById("originalText").textContent =
            "問題データを読み込めませんでした。";

    }

}


// ============================
// 問題を表示
// ============================

function showQuestion(){

    if(questions.length === 0){
        return;
    }

    currentQuestion =
        questions[currentQuestionIndex];


    document.getElementById("questionNumber").textContent =
        `Question ${currentQuestionIndex + 1} / ${questions.length}`;


    const progress =
        ((currentQuestionIndex + 1) / questions.length) * 100;

    document.getElementById("progressFill").style.width =
        progress + "%";


    document.getElementById("originalText").textContent =
        currentQuestion.text || "";


    const pointList =
        document.getElementById("pointList");

    pointList.innerHTML = "";


    currentQuestion.points.forEach(point => {

        const li = document.createElement("li");

        li.textContent = point;

        pointList.appendChild(li);

    });


    const audio =
        document.getElementById("audio");

    audio.pause();

    audio.currentTime = 0;


    if(currentQuestion.audio){

        audio.src =
            "audio/" + currentQuestion.audio;

        audio.load();

    }else{

        audio.removeAttribute("src");

    }


    document.getElementById("playBtn").textContent =
        "▶ 再生";


    document.getElementById("summaryInput").value = "";


    document.getElementById("charCount").textContent =
        "文字数：0文字";


    document.getElementById("textArea").style.display =
        "none";

    document.getElementById("hintArea").style.display =
        "none";


    document.getElementById("nextBtn").style.display =
        "none";

}


// ============================
// 音声再生
// ============================

document.getElementById("playBtn").addEventListener(
    "click",
    function(){

        const audio =
            document.getElementById("audio");

        if(!audio.src){

            alert("音声が登録されていません。");

            return;

        }

        audio.play();

    }
);


// ============================
// テキスト表示
// ============================

document.getElementById("toggleTextBtn").addEventListener(
    "click",
    function(){

        const area =
            document.getElementById("textArea");

        if(area.style.display === "none"){

            area.style.display = "block";

            this.textContent =
                "🙈 テキストを隠す";

        }else{

            area.style.display = "none";

            this.textContent =
                "👁 テキストを表示";

        }

    }
);


// ============================
// 要点表示
// ============================

document.getElementById("hintBtn").addEventListener(
    "click",
    function(){

        const area =
            document.getElementById("hintArea");

        if(area.style.display === "none"){

            area.style.display = "block";

            this.textContent =
                "🙈 要点を隠す";

        }else{

            area.style.display = "none";

            this.textContent =
                "💡 要点を見る";

        }

    }
);

// ============================
// 文字数カウント
// ============================

document.getElementById("summaryInput").addEventListener(
    "input",
    function(){

        const count =
            this.value.length;

        document.getElementById("charCount").textContent =
            `文字数：${count}文字`;

    }
);


// ============================
// 自己評価
// ============================

function rate(result){

    console.log("自己評価:", result);

    document.getElementById("nextBtn").style.display =
        "block";

}


// ============================
// 次の問題
// ============================

document.getElementById("nextBtn").addEventListener(
    "click",
    function(){

        currentQuestionIndex++;

        if(currentQuestionIndex >= questions.length){

            alert("🎉 全ての問題が終了しました！");

            return;

        }

        showQuestion();

    }
);


// ============================
// 起動
// ============================

loadQuestions();

</script>
</body>
