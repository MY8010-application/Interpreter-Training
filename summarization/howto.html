<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summarization - テーマ選択</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#cccccc;
    color:#333;
    text-align:center;
    padding:20px;
}
.container{
    max-width:700px;
    margin:40px auto;
    background:#e9e9e9;
    border-radius:24px;
    padding:40px;
}
.app-title{
    display:inline-block;
    background:white;
    padding:18px 40px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:0 6px 0 #d9defa,0 12px 24px rgba(0,0,0,.08);
}
.title-main{
    font-size:34px;
    font-weight:800;
}
.title-sub{
    margin-top:5px;
    font-size:18px;
    font-weight:600;
}
.logo{
    color:#4255ff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:25px;
}
.theme-card{
    background:white;
    border-radius:22px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}
.theme-card h2{
    margin-bottom:10px;
    font-size:26px;
}
.theme-description{
    color:#666;
    margin-bottom:25px;
    line-height:1.6;
}
.theme-options{
    display:flex;
    flex-direction:column;
    gap:14px;
}
.theme-option{
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px;
    background:#f5f5f5;
    border:2px solid #ddd;
    border-radius:16px;
    cursor:pointer;
    text-align:left;
    transition:.2s;
}
.theme-option:hover{
    transform:translateY(-2px);
    border-color:#4255ff;
}
.theme-option input{
    width:22px;
    height:22px;
    accent-color:#4255ff;
    flex-shrink:0;
}
.theme-option span{
    font-size:19px;
    font-weight:bold;
}
.category{
    margin-bottom:18px;
}
.category-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f5f5f5;
    border:2px solid #ddd;
    border-radius:16px;
    padding:18px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}
.category-header:hover{
    border-color:#4255ff;
    transform:translateY(-2px);
}
.category-content{
    display:none;
    margin-top:12px;
}
.category-content.open{
    display:flex;
    flex-direction:column;
    gap:12px;
}
.start-btn{
    margin-top:30px;
    width:100%;
    padding:20px;
    border:none;
    border-radius:18px;
    background:#4255ff;
    color:white;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}
.start-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(66,85,255,.3);
}
.start-btn:active{
    transform:translateY(1px);
}
.back-btn{
    margin-top:15px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:18px;
    background:#888;
    color:white;
    font-size:18px;
    cursor:pointer;
}
@media(max-width:768px){
    .container{
        margin:20px;
        padding:25px;
    }
    .title-main{
        font-size:28px;
    }
    .theme-card{
        padding:22px;
    }
    .theme-card h2{
        font-size:23px;
    }
    .theme-option span{
        font-size:16px;
    }
    .start-btn{
        font-size:20px;
        padding:18px;
    }
}
</style>
</head>
<body>
<div class="container">

<div class="app-title">
<div class="title-main">📝 Summarization</div>
<div class="title-sub">テーマ選択</div>
</div>

<div class="logo">
INTERPRETER TRAINING
</div>

<div class="theme-card">

<h2>📚 練習するテーマを選択</h2>

<div class="theme-description">
練習したいテーマを1つ選択してください。
</div>

<div class="category">

<div class="category-header" onclick="toggleCategory('tenrikyo')">
<span>📖 天理教テーマ</span>
<span id="arrow-tenrikyo">▼</span>
</div>

<div class="category-content open" id="tenrikyo">

<label class="theme-option">
<input type="radio" name="theme" value="t001">
<span>概要</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="t002,t003">
<span>親神様・教祖</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="t004,t005">
<span>ぢばと陽気ぐらし</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="t006,t007">
<span>つとめ・さづけ・ようぼく</span>
</label>

</div>

</div>

<div class="category">

<div class="category-header" onclick="toggleCategory('general')">
<span>🌎 一般テーマ</span>
<span id="arrow-general">▶</span>
</div>

<div class="category-content" id="general">

<label class="theme-option">
<input type="radio" name="theme" value="g001">
<span>コーヒー</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="g002">
<span>お茶</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="g003">
<span>ラーメン</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="g004">
<span>寿司</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="g005">
<span>カレー</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="g006">
<span>桜</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="g007">
<span>富士山</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="g008">
<span>温泉</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="g009">
<span>新幹線</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="g010">
<span>コンビニ</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="g011">
<span>野球</span>
</label>

<label class="theme-option">
<input type="radio" name="theme" value="g012">
<span>サッカー</span>
</label>

</div>

</div>

<button class="start-btn" onclick="startTraining()">
START
</button>

<button class="back-btn" onclick="location.href='index.html'">
← 戻る
</button>

</div>

</div>
<script>
function toggleCategory(category){

    const target=document.getElementById(category);
    const other=category==="tenrikyo"
        ? document.getElementById("general")
        : document.getElementById("tenrikyo");

    const targetArrow=document.getElementById(
        "arrow-"+category
    );

    const otherName=category==="tenrikyo"
        ? "general"
        : "tenrikyo";

    const otherArrow=document.getElementById(
        "arrow-"+otherName
    );


    if(target.classList.contains("open")){

        target.classList.remove("open");
        targetArrow.textContent="▶";

    }else{

        target.classList.add("open");
        targetArrow.textContent="▼";

        other.classList.remove("open");
        otherArrow.textContent="▶";

    }

}


function startTraining(){

    const selected=document.querySelector(
        'input[name="theme"]:checked'
    );

    if(!selected){

        alert("テーマを選択してください。");

        return;

    }


    let themes=[];


    const ids=selected.value.split(",");

    themes.push(...ids);


    localStorage.setItem(
        "selectedThemes",
        JSON.stringify(themes)
    );


    location.href="quiz.html";

}
</script>
