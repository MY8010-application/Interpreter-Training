<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Short Interpretation</title>

<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#cccccc;
    color:#333;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:#e9e9e9;
    border-radius:24px;
    padding:40px;
    position:relative;
}

.top-btn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 16px;
    border:none;
    border-radius:12px;
    background:#888;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.top-btn:hover{
    transform:translateY(-2px);
    background:#666;
}

@media(max-width:768px){

    .top-btn{
        top:15px;
        right:15px;
        padding:8px 12px;
        font-size:12px;
    }

}

.app-title{
    display:inline-block;
    background:white;
    padding:18px 40px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:
        0 6px 0 #d9defa,
        0 12px 24px rgba(0,0,0,.08);
}

.title-main{
    font-size:34px;
    font-weight:800;
}

.title-sub{
    margin-top:5px;
    font-size:18px;
    font-weight:600;
}

.logo{
    color:#4255ff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:22px;
    padding:30px;
    text-align:left;
    box-shadow:
        0 10px 25px rgba(0,0,0,.12);
}

.card h2{
    text-align:center;
    margin-bottom:10px;
}

.description{
    text-align:center;
    color:#666;
    margin-bottom:25px;
    line-height:1.6;
}

.theme-options{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.theme-option{
    display:flex;
    align-items:center;
    gap:12px;
    padding:17px;
    background:#f5f5f5;
    border:2px solid #ddd;
    border-radius:16px;
    cursor:pointer;
    transition:.2s;
}

.theme-option:hover{
    transform:translateY(-2px);
    border-color:#4255ff;
}

.theme-option input{
    width:21px;
    height:21px;
    accent-color:#4255ff;
    flex-shrink:0;
}

.theme-option span{
    font-size:18px;
    font-weight:bold;
}

.start-btn{
    margin-top:30px;
    width:100%;
    padding:20px;
    border:none;
    border-radius:18px;
    background:#4255ff;
    color:white;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.start-btn:hover{
    transform:translateY(-3px);
    box-shadow:
        0 8px 20px rgba(66,85,255,.3);
}

.start-btn:active{
    transform:translateY(1px);
}

.back-btn{
    margin-top:15px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:18px;
    background:#888;
    color:white;
    font-size:18px;
    cursor:pointer;
}

@media(max-width:768px){

    .container{
        margin:20px;
        padding:25px;
    }

    .title-main{
        font-size:28px;
    }

    .theme-option span{
        font-size:16px;
    }

    .start-btn{
        font-size:20px;
        padding:18px;
    }

}

</style>
</head>

<body>

<div class="container">

<button class="top-btn" onclick="location.href='../index.html'">
    ← トップへ
</button>

<div class="app-title">
    <div class="title-main">🎤 Short Interpretation</div>
    <div class="title-sub">短文通訳練習</div>
</div>

<div class="logo">INTERPRETER TRAINING</div>

<div class="card">

<h2>テーマを選択</h2>

<div class="description" id="description">
    練習したいテーマを選択してください。
</div>

<div class="theme-options" id="themeOptions"></div>

<button class="start-btn" onclick="startTraining()">
    練習を開始する
</button>

<button class="back-btn" onclick="history.back()">
    ← 戻る
</button>

</div>

</div>

<script>

const level =
    localStorage.getItem("shortLevel") || "normal";


const normalThemes = [
    {id:"t001",name:"概要"},
    {id:"t002",name:"親神様"},
    {id:"t003",name:"教祖"},
    {id:"t004",name:"陽気ぐらし"},
    {id:"t005",name:"ぢば"},
    {id:"t006",name:"つとめ"},
    {id:"t007",name:"さづけ・ようぼく"}
];


const challengeThemes = [
    {id:"c001",name:"親神様"},
    {id:"c002",name:"教祖"},
    {id:"c003",name:"陽気ぐらし"},
    {id:"c004",name:"ぢば"},
    {id:"c005",name:"つとめ"},
    {id:"c006",name:"さづけ"},
    {id:"c007",name:"ようぼく"}
];


const themes =
    level === "challenge"
        ? challengeThemes
        : normalThemes;


const themeOptions =
    document.getElementById("themeOptions");


themes.forEach(theme => {

    const label =
        document.createElement("label");

    label.className =
        "theme-option";

    label.innerHTML = `
        <input
            type="radio"
            name="theme"
            value="${theme.id}"
        >
        <span>${theme.name}</span>
    `;

    themeOptions.appendChild(label);

});


function startTraining(){

    const selected =
        document.querySelector('input[name="theme"]:checked');

    if(!selected){
        alert("テーマを選択してください。");
        return;
    }

    localStorage.setItem(
        "shortSelectedThemes",
        JSON.stringify([selected.value])
    );

    location.href = "quiz.html";
}

</script>

</body>
</html>
