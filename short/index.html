<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Short Interpretation</title>

<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Segoe UI',Arial,sans-serif;

    background:#cccccc;

    color:#333;

    text-align:center;

    padding:20px;

}

.container{

    max-width:700px;

    margin:40px auto;

    background:#e9e9e9;

    border-radius:24px;

    padding:40px;

}

.app-title{

    display:inline-block;

    background:white;

    padding:18px 40px;

    border-radius:20px;

    margin-bottom:25px;

    box-shadow:
        0 6px 0 #d9defa,
        0 12px 24px rgba(0,0,0,.08);

}

.title-main{

    font-size:34px;

    font-weight:800;

}

.title-sub{

    margin-top:5px;

    font-size:18px;

    font-weight:600;

}

.logo{

    color:#4255ff;

    font-size:14px;

    font-weight:bold;

    letter-spacing:1px;

    margin-bottom:25px;

}


/* ============================
   カード
============================ */

.card{

    background:white;

    border-radius:22px;

    padding:30px;

    text-align:left;

    box-shadow:
        0 10px 25px rgba(0,0,0,.12);

}

.card h2{

    text-align:center;

    margin-bottom:30px;

}


/* ============================
   練習の流れ
============================ */

.step{

    display:flex;

    align-items:flex-start;

    gap:15px;

    margin-bottom:25px;

}

.icon{

    font-size:34px;

    width:50px;

    text-align:center;

    flex-shrink:0;

}

.text h3{

    margin:0 0 5px;

    font-size:20px;

}

.text p{

    margin:0;

    color:#666;

    line-height:1.6;

}


/* ============================
   レベル選択
============================ */

.level-title{

    text-align:center;

    margin-top:35px;

    margin-bottom:20px;

    font-size:22px;

    font-weight:bold;

}

.level-options{

    display:flex;

    flex-direction:column;

    gap:15px;

}

.level-option{

    display:flex;

    align-items:flex-start;

    gap:15px;

    padding:20px;

    background:#f5f5f5;

    border:2px solid #ddd;

    border-radius:18px;

    cursor:pointer;

    transition:.2s;

}

.level-option:hover{

    transform:translateY(-2px);

    border-color:#4255ff;

}

.level-option input{

    width:22px;

    height:22px;

    margin-top:3px;

    accent-color:#4255ff;

    flex-shrink:0;

}

.level-content{

    text-align:left;

}

.level-name{

    font-size:20px;

    font-weight:bold;

    margin-bottom:5px;

}

.level-description{

    color:#666;

    line-height:1.5;

}


/* ============================
   ボタン
============================ */

.start-btn{

    margin-top:30px;

    width:100%;

    padding:20px;

    border:none;

    border-radius:18px;

    background:#4255ff;

    color:white;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

.start-btn:hover{

    transform:translateY(-3px);

    box-shadow:
        0 8px 20px rgba(66,85,255,.3);

}

.start-btn:active{

    transform:translateY(1px);

}


.back-btn{

    margin-top:15px;

    width:100%;

    padding:15px;

    border:none;

    border-radius:18px;

    background:#888;

    color:white;

    font-size:18px;

    cursor:pointer;

}


/* ============================
   スマホ
============================ */

@media(max-width:768px){

.container{

    margin:20px;

    padding:25px;

}

.title-main{

    font-size:28px;

}

.level-name{

    font-size:18px;

}

.start-btn{

    font-size:20px;

    padding:18px;

}

}

</style>

</head>

<body>

<div class="container">

<!-- ============================
     タイトル
============================ -->

<div class="app-title">

<div class="title-main">
🎤 Short Interpretation
</div>

<div class="title-sub">
短文通訳練習
</div>

</div>

<div class="logo">
INTERPRETER TRAINING
</div>

<!-- ============================
     練習の流れ
============================ -->

<div class="card">

<h2>練習の流れ</h2>

<div class="step">

<div class="icon">🎧</div>

<div class="text">

<h3>① 音声を聞く</h3>

<p>
日本語の音声を集中して聞きます。
</p>

</div>

</div>

<div class="step">

<div class="icon">🧠</div>

<div class="text">

<h3>② 内容を理解する</h3>

<p>
聞いた内容を頭の中で整理します。
</p>

</div>

</div>

<div class="step">

<div class="icon">🗣️</div>

<div class="text">

<h3>③ 外国語に通訳する</h3>

<p>
聞いた日本語を、できるだけ素早く自然な外国語に通訳します。
</p>

</div>

</div>

<div class="step">

<div class="icon">📖</div>

<div class="text">

<h3>④ 原文を確認する</h3>

<p>
すべての問題が終わったあと、今回の原文をまとめて確認します。
</p>

</div>

</div>

<div class="step">

<div class="icon">📊</div>

<div class="text">

<h3>⑤ 自己評価する</h3>

<p>
今回の通訳を振り返り、総合的に自己評価します。
</p>

</div>

</div>

<!-- ============================
     レベル選択
============================ -->

<div class="level-title">
レベルを選択
</div>

<div class="level-options">

<label class="level-option">

<input
type="radio"
name="level"
value="normal"
checked>

<div class="level-content">

<div class="level-name">
🟦 ノーマルレベル
</div>

<div class="level-description">
音声を何度でも再生できます。
</div>

</div>

</label>

<label class="level-option">

<input
type="radio"
name="level"
value="challenge">

<div class="level-content">

<div class="level-name">
🔥 チャレンジレベル
</div>

<div class="level-description">
音声は1問につき1回のみ再生できます。<br>
原文は問題中には表示されません。
</div>

</div>

</label>

</div>

<!-- ============================
     テーマ選択へ
============================ -->

<button
class="start-btn"
onclick="startShort()">

テーマ選択へ

</button>

<!-- ============================
     トップへ戻る
============================ -->

<button
class="back-btn"
onclick="location.href='../index.html'">

← トップへ戻る

</button>

</div>

</div>

<script>

/* ============================
   レベルを保存
============================ */

function startShort(){

    const selected =
        document.querySelector(
            'input[name="level"]:checked'
        );

    if(!selected){

        alert("レベルを選択してください。");

        return;

    }


    localStorage.setItem(
        "shortLevel",
        selected.value
    );


    location.href = "howto.html";

}

</script>

</body>

</html>
