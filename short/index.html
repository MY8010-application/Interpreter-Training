<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Short Interpretation</title>
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#cccccc;
    color:#333;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:#e9e9e9;
    border-radius:24px;
    padding:40px;
    position:relative;
}
    
.top-btn{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 16px;
    border:none;
    border-radius:12px;
    background:#888;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.top-btn:hover{
    transform:translateY(-2px);
    background:#666;
}

@media(max-width:768px){

    .top-btn{
        top:15px;
        right:15px;
        padding:8px 12px;
        font-size:12px;
    }

}
.app-title{
    display:inline-block;
    background:white;
    padding:18px 40px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:
        0 6px 0 #d9defa,
        0 12px 24px rgba(0,0,0,.08);
}

.title-main{
    font-size:34px;
    font-weight:800;
}

.title-sub{
    margin-top:5px;
    font-size:18px;
    font-weight:600;
}

.logo{
    color:#4255ff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:22px;
    padding:30px;
    text-align:left;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.card h2{
    text-align:center;
    margin-bottom:25px;
}

.step{
    display:flex;
    align-items:flex-start;
    gap:15px;
    margin-bottom:25px;
}

.icon{
    font-size:34px;
    width:50px;
    text-align:center;
    flex-shrink:0;
}

.text h3{
    margin:0 0 5px;
    font-size:20px;
}

.text p{
    margin:0;
    color:#666;
    line-height:1.6;
}

.level-title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin:30px 0 15px;
}

.level-options{
    display:flex;
    gap:15px;
}

.level-btn{
    flex:1;
    padding:20px 10px;
    border:2px solid #ddd;
    border-radius:18px;
    background:#f5f5f5;
    cursor:pointer;
    transition:.2s;
}

.level-btn:hover{
    transform:translateY(-3px);
    border-color:#4255ff;
}

.level-btn.selected{
    background:#4255ff;
    color:white;
    border-color:#4255ff;
}

.level-btn strong{
    display:block;
    font-size:20px;
    margin-bottom:7px;
}

.level-btn span{
    font-size:14px;
}

.start-btn{
    margin-top:25px;
    width:100%;
    padding:20px;
    border:none;
    border-radius:18px;
    background:#4255ff;
    color:white;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.start-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(66,85,255,.3);
}

.back-btn{
    margin-top:15px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:18px;
    background:#888;
    color:white;
    font-size:18px;
    cursor:pointer;
}

@media(max-width:768px){

    .container{
        margin:20px;
        padding:25px;
    }

    .title-main{
        font-size:28px;
    }

    .step{
        flex-direction:row;
    }

    .level-options{
        flex-direction:column;
    }

    .start-btn{
        font-size:20px;
        padding:18px;
    }

    .level-btn{
        padding:12px 6px;
    }

    .level-btn strong{
        font-size:17px;
    }

    .level-btn span{
        font-size:12px;
    }

    .level-btn.disabled{
        opacity:0.5;
        cursor:not-allowed;
    }
}
</style>
</head>

<body>
<div class="container">

<button class="top-btn" onclick="location.href='../index.html'">
← トップへ
</button>
    
<div class="app-title">
    <div class="title-main">🎤 Short Interpretation</div>
    <div class="title-sub">短文通訳練習</div>
</div>

<div class="logo">INTERPRETER TRAINING</div>

<div class="card">

<h2>練習の流れ</h2>

<div class="step">
    <div class="icon">🎧</div>
    <div class="text">
        <h3>① 音声を聞く</h3>
        <p>日本語の音声を聞いて、内容を理解します。</p>
    </div>
</div>

<div class="step">
    <div class="icon">🧠</div>
    <div class="text">
        <h3>② 内容を整理する</h3>
        <p>話のポイントを頭の中で整理します。</p>
    </div>
</div>

<div class="step">
    <div class="icon">🎤</div>
    <div class="text">
        <h3>③ 外国語に通訳する</h3>
        <p>聞いた日本語を、外国語で通訳してください。</p>
    </div>
</div>

<div class="step">
    <div class="icon">📖</div>
    <div class="text">
        <h3>④ 原文を確認する</h3>
        <p>テーマ終了後、今回の問題の原文をまとめて確認します。</p>
    </div>
</div>

<div class="step">
    <div class="icon">📊</div>
    <div class="text">
        <h3>⑤ 自己評価する</h3>
        <p>5つの評価基準を参考に、「できた」「もう少し」「がんばる」で評価します。</p>
    </div>
</div>

<div class="level-title">練習レベルを選択</div>

<div class="level-options">

<button class="level-btn selected" onclick="selectLevel('normal',this)">
    <strong>ノーマルレベル</strong>
    <span>音声を何度でも再生できます。</span>
</button>

<button class="level-btn" onclick="selectLevel('challenge',this)">
    <strong>チャレンジレベル</strong>
    <span>音声は1回のみ再生できます。</span>
</button>

</div>

<button class="start-btn" onclick="startTraining()">
    テーマ選択へ
</button>

<button class="back-btn" onclick="location.href='../index.html'">
    ← 戻る
</button>

</div>
</div>

<script>
let selectedLevel = "normal";

function selectLevel(level,button){
    selectedLevel = level;

    document.querySelectorAll(".level-btn").forEach(btn => {
        btn.classList.remove("selected");
    });

    button.classList.add("selected");
}

function startTraining(){
    localStorage.setItem("shortLevel",selectedLevel);
    location.href="howto.html";
}
</script>
<script>
fetch(
    "https://script.google.com/macros/s/AKfycbxHHbkhTkYuUj6nmbIQMu0o-e4u4669nMrAU3p9fATmTk4K_KD2dzL3LtFhbl9Twxj1/exec?course=Short"
);
</script>

</body>
</html>
